apiVersion: v1
kind: Service
metadata:
  name: {{ include "backend.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "backend.fullname" . }}-postgres
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ports:
  - port: {{ .Values.postgres.port }}
    targetPort: {{ .Values.postgres.port }}
  selector:
    app: {{ include "backend.fullname" . }}-postgres
